spring.application.name=Spring e-com
spring.config.import=optional:file:.env[.properties]
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.threads.virtual.enabled=true
spring.datasource.hikari.connection-timeout=10000
# springdoc-openapi configurations
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.document-title=Spring E-com API
springdoc.swagger-ui.path=/api-docs/index.html
# Forward headers strategy for proxy/load balancer
server.forward-headers-strategy=framework
# OpenAPI server URLs
app.openapi.prod-url=${OPENAPI_PROD_URL:https://spring-e-com.duckdns.org}
# RFC 7807 Problem Details
spring.mvc.problemdetails.enabled=true