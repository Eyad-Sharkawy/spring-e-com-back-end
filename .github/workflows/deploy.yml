name: Deploy Spring E-com Backend

on:
  push:
    branches:
      - main
    paths:
      - 'src/main/**'
      - 'pom.xml'
      - '.github/workflows/**'
      - 'docker-compose.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/spring-e-com-back-end
            
            # Force server to match GitHub exactly
            git fetch origin
            git reset --hard origin/main
            
            # Build the new image and seamlessly restart the Spring Boot container
            sudo docker compose up -d --build
            
            # Clean up old, unused Docker images to save disk space
            sudo docker image prune -f
